name: Nova Client Tests
# Branches are tested once, through their PR; main on push. Pushing every
# branch as well ran each PR commit twice on the one shared runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    # Every Python the client says it supports: "3.12+" (requires-python and
    # both READMEs), so every release from 3.12 to the newest. Add each new
    # release here when it comes out; move the floor only together with
    # requires-python and the READMEs.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # Exactly what uv.lock says, dev group included. --locked fails if
        # pyproject.toml changed without re-locking. uv is pinned so a new
        # release cannot change how the lock is read.
        working-directory: .
        run: |
          python -m pip install uv==0.9.22
          # The same version as setup-python: the venv is what the tests run on,
          # so this is the line that decides it.
          uv sync --locked --python ${{ matrix.python }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -c 'import sys; v = "%d.%d" % sys.version_info[:2]; assert v == "${{ matrix.python }}", v'

      - name: python/requirements.txt is the lock's export
        # pip users install from it, so it must be exactly what was tested.
        # The export is the same on every Python, so check it once.
        if: matrix.python == '3.13'
        working-directory: .
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o python/requirements.txt
          git diff --exit-code python/requirements.txt || {
            echo "python/requirements.txt is stale: run the uv export above and commit it." >&2
            exit 1
          }

      - name: Run tests
        run: pytest

  powershell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python (for the mock hub the Pester tests run against)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install mock server dependencies
        # Into .venv at the repo root, where the Pester tests look first.
        run: |
          python -m pip install uv==0.9.22
          uv sync --locked --python 3.13

      # The runner image has no PowerShell, so every `shell: pwsh` step failed
      # before running anything: this job was red on every push from the day it
      # was added, and no Pester test ever ran in CI. Install it from the
      # release tarball (no apt repo or sudo needed). Pinned, so a new release
      # cannot change CI under us.
      - name: Install PowerShell
        run: |
          PWSH_VERSION=7.6.6
          mkdir -p "$HOME/.local/opt/pwsh" "$HOME/.local/bin"
          curl -fsSL -o /tmp/pwsh.tgz \
            "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/pwsh.tgz -C "$HOME/.local/opt/pwsh"
          chmod +x "$HOME/.local/opt/pwsh/pwsh"
          ln -sf "$HOME/.local/opt/pwsh/pwsh" "$HOME/.local/bin/pwsh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pwsh" -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # PSScriptAnalyzer catches the class of bug that killed the old
      # run_nova_cycle.ps1: assigning to $matches, which the -match operator
      # silently clobbers. Worth having even though only the PS7 script can
      # actually be executed on Linux.
      - name: Lint and test with PowerShell
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-ScriptAnalyzer -Path powershell -Recurse -Severity Error, Warning -EnableExit
          Invoke-Pester -Path powershell/tests -CI
